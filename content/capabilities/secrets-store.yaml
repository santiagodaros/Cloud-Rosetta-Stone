id: secrets-store
category: identity
name:
  es: Almacén de secretos
  en: Secrets store
description:
  es: Almacenamiento gestionado de secretos con control de acceso, versionado y auditoría.
  en: Managed secret storage with access control, versioning and auditing.
providers:
  azure:
    services:
      - service: Azure Key Vault
        docs: https://learn.microsoft.com/azure/key-vault/general/overview
  aws:
    services:
      - service: AWS Secrets Manager
        docs: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
  gcp:
    services:
      - service: Secret Manager
        docs: https://docs.cloud.google.com/secret-manager/docs/overview
caveats:
  - es: Key Vault agrupa secretos, claves y certificados. En AWS eso se reparte entre Secrets Manager, KMS y ACM; en GCP entre Secret Manager, Cloud KMS y Certificate Manager.
    en: Key Vault groups secrets, keys and certificates. In AWS that is split across Secrets Manager, KMS and ACM; in GCP across Secret Manager, Cloud KMS and Certificate Manager.
