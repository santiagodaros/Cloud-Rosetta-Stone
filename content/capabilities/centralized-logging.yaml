      - service: "Amazon CloudWatch Logs"
        docs: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/WhatIsCloudWatchLogs.html
  gcp:
    services:
      - service: "Cloud Logging"
        docs: https://docs.cloud.google.com/logging/docs/overview
