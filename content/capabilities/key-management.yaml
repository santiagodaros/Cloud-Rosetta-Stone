id: key-management
category: identity
name:
  es: "Gestión de claves criptográficas"
  en: "Cryptographic key management"
description:
  es: "Claves de cifrado gestionadas (CMK) con control de acceso, rotación y auditoría."
  en: "Managed encryption keys (CMK) with access control, rotation and auditing."
providers:
  azure:
    services:
      - service: "Azure Key Vault (keys)"
        docs: https://learn.microsoft.com/azure/key-vault/keys/about-keys
  aws:
    services:
      - service: "AWS KMS"
        docs: https://docs.aws.amazon.com/kms/latest/developerguide/overview.html
  gcp:
    services:
      - service: "Cloud KMS"
        docs: https://docs.cloud.google.com/kms/docs/key-management-service
caveats:
  - es: "En AWS el acceso a una clave lo define primero la key policy de KMS (además de IAM); en Azure y GCP alcanza con RBAC/IAM sobre la clave o el contenedor. Copiar permisos de IAM sin la key policy es el error típico al migrar a AWS."
    en: "In AWS key access is defined first by the KMS key policy (in addition to IAM); in Azure and GCP RBAC/IAM on the key or its container is enough. Copying IAM permissions without the key policy is the typical mistake when migrating to AWS."
