provider: aws
bindings:
  ingress:
    service: { es: "Application Load Balancer interno", en: "Internal Application Load Balancer" }
    config: { es: "Listener HTTPS con certificado de ACM", en: "HTTPS listener with an ACM certificate" }
  app:
    service: Amazon ECS on Fargate
    config: { es: "Subnets privadas, sin IP pública, sin NAT", en: "Private subnets, no public IP, no NAT" }
  identity:
    service: IAM Role (ECS task role)
    config: { es: "rds-db:connect sobre un usuario de base concreto", en: "rds-db:connect on one specific database user" }
  db-access:
    service: { es: "RDS en subnets privadas + security groups", en: "RDS in private subnets + security groups" }
    config: { es: "Nativo de la VPC (no requiere endpoint)", en: "VPC-native (no endpoint needed)" }
  database:
    service: Amazon RDS for PostgreSQL
    config: iam_database_authentication_enabled
    from:
      azure:
        es: "El \"token\" de IAM es una firma generada localmente que dura 15 minutos y solo sirve para abrir la conexión, con un límite de conexiones nuevas por segundo."
        en: "The IAM \"token\" is a locally generated signature that lasts 15 minutes and only opens the connection, with a new-connections-per-second limit."
gotchas:
  - id: rds-iam-user-needs-sql
    severity: iam
    title:
      es: El usuario IAM de la base se crea con SQL, y con rds_iam deja de aceptar contraseña
      en: The IAM database user is created with SQL, and with rds_iam it stops accepting passwords
    body:
      es: >-
        Habilitar IAM auth en la instancia no crea ningún usuario. Hay que ejecutar CREATE USER app; GRANT rds_iam
        TO app; y además los GRANT sobre tablas. En PostgreSQL, a un usuario con rds_iam (incluido el master) la
        autenticación IAM le gana a la contraseña: no se lo asignes al master si lo necesitás como break-glass.
      en: >-
        Enabling IAM auth on the instance doesn't create any user. You must run CREATE USER app; GRANT rds_iam TO
        app; plus table GRANTs. In PostgreSQL, for a user with rds_iam (including master) IAM auth takes
        precedence over the password: don't grant it to master if you need it as break-glass.
    sources:
      - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html
      - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.DBAccounts.html
    verified_at: 2026-10-06
    roles: [database, identity]
    exams: [SAA-C03]
  - id: rds-iam-token-lifetime
    severity: reliability
    title:
      es: El token de IAM auth dura 15 minutos y solo sirve para abrir la conexión
      en: The IAM auth token lasts 15 minutes and is only used to open the connection
    body:
      es: >-
        El token vence a los 15 minutos y se usa solo para autenticar: no afecta la sesión una vez establecida,
        pero si intentás conectarte con un token vencido, la conexión se rechaza.
      en: >-
        The token expires after 15 minutes and is used only to authenticate: it doesn't affect the session once
        established, but if you try to connect with an expired token, the connection is rejected.
    sources:
      - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html
      - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.Connecting.html
    verified_at: 2026-10-06
    roles: [identity, database]
    exams: [SAA-C03]
  - id: fargate-private-needs-endpoints
    severity: cost
    title:
      es: Fargate en subnet privada sin NAT necesita varios VPC endpoints pagos
      en: Fargate in a private subnet without NAT needs several paid VPC endpoints
    body:
      es: >-
        Para bajar la imagen sin salida a internet, la tarea necesita interface endpoints de ECR (api y dkr), más el
        gateway endpoint de S3 (donde ECR guarda las capas). Si usa el driver de logs awslogs, también necesita el
        interface endpoint de CloudWatch Logs. Cada interface endpoint se cobra por hora por AZ. La alternativa (NAT
        Gateway) también tiene cargo por hora y por GB.
      en: >-
        To pull the image without internet egress, the task needs ECR (api and dkr) interface endpoints, plus the S3
        gateway endpoint (where ECR stores layers). If it uses the awslogs log driver, it also needs the CloudWatch
        Logs interface endpoint. Each interface endpoint is billed hourly per AZ. The alternative (NAT Gateway) is
        also billed hourly and per GB.
    sources:
      - https://repost.aws/knowledge-center/ecs-fargate-tasks-private-subnet
      - https://docs.aws.amazon.com/AmazonECR/latest/userguide/vpc-endpoints.html
      - https://aws.amazon.com/privatelink/pricing/
      - https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html
    verified_at: 2026-10-06
    roles: [app]
    exams: [SAA-C03, ANS-C01]
  - id: internal-alb-certificate
    severity: security
    title:
      es: HTTPS en un ALB interno igual necesita un certificado de servidor SSL
      en: HTTPS on an internal ALB still needs an SSL server certificate
    body:
      es: >-
        Para crear un listener HTTPS hay que desplegar al menos un certificado de servidor SSL (de ACM o de IAM).
        ACM no puede validar recursos en una private hosted zone de VPC ni en ningún otro dominio privado, aunque
        el ALB sea interno. ACM no valida la propiedad del dominio en certificados importados ni firmados por una CA
        privada.
      en: >-
        To create an HTTPS listener you must deploy at least one SSL server certificate (from ACM or IAM). ACM
        cannot validate resources in a VPC private hosted zone or any other private domain, even if the ALB is
        internal. ACM does not validate domain ownership for imported certificates or for certificates signed by a
        private CA.
    sources:
      - https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html
      - https://docs.aws.amazon.com/acm/latest/userguide/domain-ownership-validation.html
    verified_at: 2026-10-06
    roles: [ingress]
    exams: [SAA-C03, SCS-C03]
  - id: master-password-in-secrets-manager
    severity: security
    title:
      es: Que la contraseña del master user la gestione Secrets Manager
      en: Let Secrets Manager manage the master user password
    body:
      es: >-
        Con manage_master_user_password = true, RDS genera la contraseña del master y la guarda en Secrets Manager. El
        provider de Terraform no permite combinarlo con password, y RDS no lo soporta en algunos escenarios (por
        ejemplo Blue/Green deployments), así que decidilo de entrada.
      en: >-
        With manage_master_user_password = true, RDS generates the master password and stores it in Secrets Manager.
        The Terraform provider doesn't allow combining it with password, and RDS doesn't support it in some scenarios
        (for example Blue/Green deployments), so decide upfront.
    sources:
      - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html
      - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/db_instance
    verified_at: 2026-10-06
    roles: [database]
    exams: [SAA-C03, SCS-C03]
cost:
  scales_to_zero: 'no'
  fixed_cost_drivers:
    - es: Application Load Balancer (cargo por hora + LCU)
      en: Application Load Balancer (hourly + LCU)
    - es: Interface endpoints de ECR api, ECR dkr y CloudWatch Logs (por hora, por AZ)
      en: ECR api, ECR dkr and CloudWatch Logs interface endpoints (hourly, per AZ)
    - es: RDS (instancia + storage)
      en: RDS (instance + storage)
  notes:
    es: >-
      Es el patrón con más costo fijo de las tres nubes: ALB y endpoints cobran aunque no haya requests, y el
      servicio de ECS mantiene al menos una tarea corriendo.
    en: >-
      It's the pattern with the highest fixed cost of the three clouds: ALB and endpoints bill with zero requests,
      and the ECS service keeps at least one task running.
