provider: aws
bindings:
  federation:
    service: IAM OIDC identity provider
    config: { es: "Uno por cuenta para token.actions.githubusercontent.com; client_id_list = sts.amazonaws.com", en: "One per account for token.actions.githubusercontent.com; client_id_list = sts.amazonaws.com" }
  deploy-identity:
    service: IAM Role
    config: { es: "Trust policy: AssumeRoleWithWebIdentity con aud y sub exactos (StringEquals)", en: "Trust policy: AssumeRoleWithWebIdentity with exact aud and sub (StringEquals)" }
    from:
      azure:
        es: "El rol junta identidad, confianza (trust policy) y permisos; en Azure son tres objetos separados. La trust policy admite StringLike, a diferencia del match exacto de un federated credential."
        en: "The role bundles identity, trust (trust policy) and permissions; in Azure those are three separate objects. The trust policy allows StringLike, unlike a federated credential's exact match."
  permissions:
    service: { es: "IAM policies adjuntas al rol", en: "IAM policies attached to the role" }
    config: { es: "Policies administradas acotadas; nunca AdministratorAccess", en: "Scoped managed policies; never AdministratorAccess" }
gotchas:
  - id: sub-condition-is-the-boundary
    severity: security
    title:
      es: IAM exige una condición sobre sub, pero acepta una que igual abre la puerta
      en: IAM requires a sub condition, but accepts one that still leaves the door open
    body:
      es: >-
        El issuer de GitHub es el mismo para todas las organizaciones: sin acotar el sub, cualquier repositorio de
        GitHub podría asumir tu rol. Por eso IAM rechaza crear o actualizar una trust policy hacia ese provider si
        falta la condición sobre sub (o job_workflow_ref) o si es solo un comodín. Pero "repo:*" o "repo:mi-org/*"
        pasan la validación. El límite real lo ponés vos: este módulo usa StringEquals con un sub por environment.
      en: >-
        GitHub's issuer is the same for every organization: without scoping sub, any GitHub repository could
        assume your role. That's why IAM rejects creating or updating a trust policy for that provider when the sub
        (or job_workflow_ref) condition is missing or is just a wildcard. But "repo:*" or "repo:my-org/*" pass
        validation. The real boundary is yours to set: this module uses StringEquals with one sub per environment.
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc_secure-by-default.html
    verified_at: 2026-10-06
    roles: [federation, deploy-identity]
    exams: [SCS-C03, SAA-C03]
  - id: environment-changes-the-sub
    severity: iam
    title:
      es: Si el job declara un environment, el sub deja de tener la rama
      en: If the job declares an environment, the sub no longer contains the branch
    body:
      es: >-
        GitHub incluye el environment en el sub cuando el job lo referencia; pull_request y la ref solo entran si el
        job no referencia un environment. Un job en main con environment production presenta
        repo:org/repo:environment:production, así que una trust policy que espera
        repo:org/repo:ref:refs/heads/main rechaza el AssumeRoleWithWebIdentity.
      en: >-
        GitHub includes the environment in the sub when the job references one; pull_request and the ref only
        appear if the job doesn't reference an environment. A job on main with environment production presents
        repo:org/repo:environment:production, so a trust policy expecting repo:org/repo:ref:refs/heads/main
        rejects AssumeRoleWithWebIdentity.
    sources:
      - https://docs.github.com/en/actions/reference/security/oidc
    verified_at: 2026-10-06
    roles: [federation]
    exams: [SCS-C03]
  - id: one-oidc-provider-per-account
    severity: operations
    title:
      es: Hay un solo OIDC provider por URL y por cuenta
      en: There's only one OIDC provider per URL per account
    body:
      es: >-
        Crear un segundo provider para token.actions.githubusercontent.com en la misma cuenta falla: IAM no
        permite registrar la misma URL dos veces en una cuenta. Si cada repo trae su propio stack de Terraform con el provider adentro, el segundo
        apply rompe. Crealo una vez (en el stack de la cuenta) y referencialo con el data source; el módulo lo
        permite con create_oidc_provider = false.
      en: >-
        Creating a second provider for token.actions.githubusercontent.com in the same account fails: IAM doesn't
        let you register the same URL twice in an account. If each repo ships its own Terraform stack with the provider inside, the second apply
        breaks. Create it once (in the account stack) and reference it with the data source; the module supports
        that with create_oidc_provider = false.
    sources:
      - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateOpenIDConnectProvider.html
      - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/data-sources/iam_openid_connect_provider
    verified_at: 2026-10-06
    roles: [federation]
    exams: [SCS-C03]
  - id: thumbprint-not-used
    severity: operations
    title:
      es: Para GitHub, el thumbprint ya no se usa (y no hace falta cargarlo)
      en: For GitHub, the thumbprint is no longer used (and you don't need to set it)
    body:
      es: >-
        IAM valida el certificado de GitHub contra su librería de CAs raíz confiables, así que thumbprint_list es
        opcional y, en el provider de Terraform, para IdPs como GitHub se guarda pero no se usa para verificar.
        Los thumbprints solo entran en juego si el IdP usa un certificado que no firma una de esas CAs, o si AWS
        no puede obtener el certificado TLS o se requiere TLS v1.3. Muchos módulos viejos todavía hardcodean un
        thumbprint "que hay que actualizar": para GitHub no es lo que rompe el login.
      en: >-
        IAM validates GitHub's certificate against its library of trusted root CAs, so thumbprint_list is optional
        and, in the Terraform provider, for IdPs like GitHub it's stored but not used for verification.
        Thumbprints only come into play if the IdP uses a certificate not signed by one of those CAs, or if AWS
        can't retrieve the TLS certificate or TLS v1.3 is required. Many old modules still hardcode a thumbprint
        "that must be rotated": for GitHub that's not what breaks login.
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
      - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/iam_openid_connect_provider
    verified_at: 2026-10-06
    roles: [federation]
    exams: [SCS-C03]
  - id: session-duration-long-applies
    severity: reliability
    title:
      es: La sesión dura 1 hora por default, y encadenar roles la limita a 1 hora sí o sí
      en: The session lasts 1 hour by default, and role chaining caps it at 1 hour regardless
    body:
      es: >-
        AssumeRoleWithWebIdentity da 3600 s por default; podés pedir hasta el MaxSessionDuration del rol (máximo
        12 h), y pedir más que eso hace fallar la llamada. Si desde ese rol asumís otro (role chaining, típico en
        multi-cuenta), la sesión queda en 1 hora como máximo. Un apply largo que se pasa del límite falla a mitad
        de camino con el state a medio escribir.
      en: >-
        AssumeRoleWithWebIdentity grants 3600 s by default; you can request up to the role's MaxSessionDuration (12
        h max), and asking for more makes the call fail. If you assume another role from it (role chaining, common
        in multi-account), the session is capped at 1 hour. A long apply that runs past the limit fails mid-way
        with a half-written state.
    sources:
      - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRoleWithWebIdentity.html
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_manage-assume.html
    verified_at: 2026-10-06
    roles: [deploy-identity]
    exams: [SCS-C03, SAA-C03]
cost:
  scales_to_zero: 'yes'
  fixed_cost_drivers: []
  notes:
    es: IAM y STS no tienen costo. Pagás solo los recursos que despliega el pipeline.
    en: IAM and STS are free. You only pay for what the pipeline deploys.
