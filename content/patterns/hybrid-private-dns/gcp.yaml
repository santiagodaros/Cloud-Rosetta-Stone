provider: gcp
bindings:
  inbound:
    service: { es: "Cloud DNS inbound server policy", en: "Cloud DNS inbound server policy" }
    config: { es: "enable_inbound_forwarding: una IP de entrada por subnet de la VPC", en: "enable_inbound_forwarding: one entry IP per subnet in the VPC" }
    from:
      aws:
        es: "No hay endpoints que dimensionar ni ENIs por hora: la policy toma una IP de cada subnet de la VPC."
        en: "There are no endpoints to size and no hourly ENIs: the policy takes one IP from every subnet in the VPC."
      azure:
        es: "No hay endpoints ni subnets dedicadas: la policy toma una IP de cada subnet de la VPC."
        en: "There are no endpoints or dedicated subnets: the policy takes one IP from every subnet in the VPC."
  private-zone:
    service: Cloud DNS private zone
    config: { es: "Visible para la VPC hub", en: "Visible to the hub VPC" }
  outbound:
    service: { es: "Cloud DNS forwarding zone", en: "Cloud DNS forwarding zone" }
    config: { es: "forwarding_path = private + Cloud Router anunciando 35.199.192.0/19", en: "forwarding_path = private + Cloud Router advertising 35.199.192.0/19" }
    from:
      azure:
        es: "Las consultas reenviadas salen desde 35.199.192.0/19, no desde IPs de tu VPC: on-premises tiene que permitir ese rango y tener la ruta de vuelta."
        en: "Forwarded queries come from 35.199.192.0/19, not from your VPC's IPs: on-premises must allow that range and have a return route."
      aws:
        es: "Las consultas reenviadas salen desde 35.199.192.0/19, no desde IPs de tu VPC: on-premises tiene que permitir ese rango y tener la ruta de vuelta."
        en: "Forwarded queries come from 35.199.192.0/19, not from your VPC's IPs: on-premises must allow that range and have a return route."
gotchas:
  - id: return-route-35-199-192-0-19
    severity: networking
    title:
      es: Hacia targets Type 1 y 2 las consultas salen desde 35.199.192.0/19; con Type 2, on-premises necesita ruta
      en: To Type 1 and 2 targets queries come from 35.199.192.0/19; with Type 2, on-premises needs a route to it
    body:
      es: >-
        Cloud DNS usa el rango 35.199.192.0/19 para todos los clientes, y es el origen de las consultas a
        targets Type 1 y Type 2 (IP interna de VPC y on-premises por VPN o Interconnect). Los targets Type 3 usan
        los rangos de Google Public DNS, y en Type 4 el rango depende de las IPs a las que resuelve el nombre.
        Para un target Type 2, on-premises necesita una ruta a 35.199.192.0/19 cuyo next hop esté en la misma VPC,
        por un túnel Cloud VPN o un attachment de Interconnect. Con BGP eso es un anuncio de ruta custom en la
        sesión BGP del Cloud Router.
      en: >-
        Cloud DNS uses the 35.199.192.0/19 range for all customers, and it is the source of queries to Type 1 and
        Type 2 targets (VPC internal IPs and on-premises over VPN or Interconnect). Type 3 targets use Google
        Public DNS source ranges, and for Type 4 the range depends on the IPs the name resolves to. For a Type 2
        target, on-premises needs a route to 35.199.192.0/19 whose next hop is in the same VPC, through a Cloud VPN
        tunnel or a Cloud Interconnect VLAN attachment. With BGP that's a custom route advertisement on the Cloud
        Router's BGP session.
    sources:
      - https://docs.cloud.google.com/dns/docs/zones/forwarding-zones
      - https://docs.cloud.google.com/dns/docs/server-policies-overview
    verified_at: 2026-10-06
    roles: [outbound]
    exams: [PCNE, PCA]
  - id: forwarding-path-private
    severity: security
    title:
      es: Con routing estándar, un destino que no es RFC 1918 se consulta por internet
      en: With standard routing, a non-RFC 1918 target is queried over the internet
    body:
      es: >-
        El default de una forwarding zone decide la ruta según la IP del destino: RFC 1918 va por la VPC, cualquier
        otra va por internet. Si tu DNS on-premises usa IPs públicas reutilizadas internamente o rangos no RFC 1918,
        las consultas salen a internet y no llegan. forwarding_path = "private" fuerza siempre la VPC.
      en: >-
        A forwarding zone's default picks the path by target IP: RFC 1918 goes through the VPC, anything else goes
        over the internet. If your on-premises DNS uses internally reused public IPs or non-RFC 1918 ranges, queries
        go out to the internet and never arrive. forwarding_path = "private" always forces the VPC.
    sources:
      - https://docs.cloud.google.com/dns/docs/zones/zones-overview
      - https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/dns_managed_zone
    verified_at: 2026-10-06
    roles: [outbound]
    exams: [PCNE]
  - id: inbound-entry-point-per-subnet
    severity: networking
    title:
      es: La inbound policy toma una IP de cada subnet, no una por región ni dos por endpoint
      en: The inbound policy takes one IP from every subnet, not one per region or two per endpoint
    body:
      es: >-
        No hay endpoints que dimensionar: la policy reserva una IP interna del rango primario de cada subnet de la
        VPC (menos las de propósito especial), así que una VPC con muchas subnets tiene muchas IPs de entrada. Lo
        que cuenta para la respuesta es la región del túnel o attachment por donde llegó la consulta, no la de la
        subnet de la IP. Poné la policy en la VPC que tiene la VPN o el Interconnect.
      en: >-
        There are no endpoints to size: the policy reserves one internal IP from the primary range of every subnet
        in the VPC (except special-purpose ones), so a VPC with many subnets has many entry IPs. What matters for the
        response is the region of the tunnel or attachment the query arrived on, not the subnet's region. Put the
        policy on the VPC that has the VPN or Interconnect.
    sources:
      - https://docs.cloud.google.com/dns/docs/server-policies-overview
    verified_at: 2026-10-06
    roles: [inbound]
    exams: [PCNE, ACE]
  - id: dns-not-shared-over-peering
    severity: networking
    title:
      es: VPC Network Peering no comparte las zonas privadas; hacen falta peering zones
      en: VPC Network Peering doesn't share private zones; you need peering zones
    body:
      es: >-
        VPC Network Peering no comparte automáticamente la información de DNS, así que una VPC peereada no resuelve
        por sí sola las zonas de la VPC hub. En hub-and-spoke, cada spoke necesita una DNS peering zone hacia el hub,
        y el DNS peering transitivo llega a un solo salto. Es la diferencia con Azure, donde un ruleset se linkea a
        VNets que ni siquiera están peereadas.
      en: >-
        VPC Network Peering doesn't automatically share DNS information, so a peered VPC doesn't resolve the hub VPC's
        zones on its own. In hub-and-spoke, each spoke needs a DNS peering zone to the hub, and transitive DNS peering
        only goes one hop. That's the difference from Azure, where a ruleset links to VNets that aren't even peered.
    sources:
      - https://docs.cloud.google.com/dns/docs/zones/peering-zones
      - https://docs.cloud.google.com/dns/docs/zones/zones-overview
      - https://learn.microsoft.com/azure/dns/private-resolver-endpoints-rulesets
    verified_at: 2026-10-06
    roles: [private-zone]
    exams: [PCNE, PCA]
cost:
  scales_to_zero: partial
  fixed_cost_drivers:
    - { es: "Zonas administradas (privada y de forwarding), por mes", en: "Managed zones (private and forwarding), monthly" }
  notes:
    es: No hay cargo por hora de endpoints. Pagás cada zona por mes, se use o no, y las consultas por millón. El Cloud Router y la VPN se pagan aparte y suelen existir ya por la conectividad.
    en: There's no hourly endpoint charge. You pay each zone monthly, used or not, and queries per million. The Cloud Router and VPN are billed separately and usually already exist for connectivity.
