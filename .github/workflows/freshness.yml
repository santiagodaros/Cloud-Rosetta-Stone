name: Frescura del contenido

# Una vez por semana: lista los gotchas con verified_at viejo y mantiene un
# único issue abierto con la tabla. Re-verificar es la contribución más valiosa.

on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s freshness > freshness.md
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('freshness.md', 'utf8');
            const title = 'Gotchas a re-verificar';
            const label = 'freshness';
            const stale = body.includes('| 🔴') || body.includes('| 🟡');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, body, state: stale ? 'open' : 'closed' });
            } else if (stale) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label, 'good first issue'] });
            }
