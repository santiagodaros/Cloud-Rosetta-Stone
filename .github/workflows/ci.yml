name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.5
  CHECKOV_VERSION: 3.3.25
  CHECKPOINT_DISABLE: '1'

jobs:
  content:
    name: Contenido + sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # el changelog ("Qué cambió") se calcula desde el historial de git
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar contenido (schema + referencias)
        run: pnpm validate
      - name: Typecheck
        run: pnpm check
      - name: Tests unitarios
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: MCP server (build + prueba de humo contra el dataset recién generado)
        working-directory: mcp
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm build
          pnpm smoke

  lighthouse:
    name: Lighthouse (performance, a11y, SEO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI (budget en lighthouserc.json)
        run: pnpm lighthouse
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  terraform-matrix:
    name: Descubrir módulos de Terraform
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: m
        run: echo "matrix=$(pnpm -s tf:matrix)" >> "$GITHUB_OUTPUT"

  terraform:
    name: TF ${{ matrix.module.provider }} · ${{ matrix.module.dir }}
    needs: terraform-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.terraform-matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.module.dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate
      - name: terraform test (mock providers, sin credenciales)
        run: terraform test
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # solo para bajar plugins sin rate limit; contents: read alcanza
          MODULE_PROVIDER: ${{ matrix.module.provider }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint/${MODULE_PROVIDER}.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint/${MODULE_PROVIDER}.hcl" --format compact

  terraform-map:
    name: Mapa Terraform contra el schema de los providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema de azurerm, aws y google (mismas versiones que el mapa)
        run: |
          mkdir -p "$RUNNER_TEMP/tfmap"
          node -e '
            const y = require("yaml"); const fs = require("fs");
            const m = y.parse(fs.readFileSync("content/terraform-map.yaml", "utf8")).providers;
            fs.writeFileSync(process.argv[1], `terraform {\n  required_providers {\n` +
              Object.entries(m).map(([n, v]) => `    ${n} = { source = "hashicorp/${n}", version = "${v}" }`).join("\n") + `\n  }\n}\n`);
          ' "$RUNNER_TEMP/tfmap/versions.tf"
          terraform -chdir="$RUNNER_TEMP/tfmap" init -backend=false -input=false
          terraform -chdir="$RUNNER_TEMP/tfmap" providers schema -json > "$RUNNER_TEMP/schema.json"
      - name: Validar recursos y bloques del mapa
        run: pnpm tf:map-check "$RUNNER_TEMP/schema.json"

  prices:
    name: Precios de lista (selectores contra las APIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cada meter de content/pricing.yaml tiene que resolver a exactamente un precio. Sin
      # GCP_BILLING_API_KEY (los PR de forks no tienen secrets) GCP usa el precio manual.
      - name: Resolver meters
        run: pnpm prices:fetch --check

  checkov:
    name: Checkov (seguridad IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install "checkov==${CHECKOV_VERSION}"
      - name: checkov
        # Cada skip tiene que estar en el código con justificación (#checkov:skip=ID:motivo).
        run: checkov -d content/patterns --framework terraform --compact --quiet --skip-path '.*/tests/.*'

  links:
    name: Fuentes oficiales vivas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Solo las fuentes del contenido: son las que respaldan cada gotcha.
          args: --config lychee.toml 'content/**/*.yaml'
          fail: true
